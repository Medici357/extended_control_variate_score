hydra:
  run:
    dir: /home/hice1/hmitra7/scratch/projects/CVSI/runs/K500/base/seed12346
  sweep:
    dir: ${paths.log_dir}/${task_name}/multiruns/${now:%Y-%m-%d}_${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      colorlog:
        (): colorlog.ColoredFormatter
        format: '[%(cyan)s%(asctime)s%(reset)s][%(purple)sHYDRA%(reset)s] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: colorlog
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
      colorlog:
        (): colorlog.ColoredFormatter
        format: '[%(cyan)s%(asctime)s%(reset)s][%(blue)s%(name)s%(reset)s][%(log_color)s%(levelname)s%(reset)s]
          - %(message)s'
        log_colors:
          DEBUG: purple
          INFO: green
          WARNING: yellow
          ERROR: red
          CRITICAL: red
    handlers:
      console:
        class: logging.StreamHandler
        formatter: colorlog
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${task_name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.run.dir=/home/hice1/hmitra7/scratch/projects/CVSI/runs/K500/base/seed12346
    - hydra.mode=RUN
    task:
    - experiment=gmm_idem
    - model.use_cvsi=true
    - trainer=gpu
    - logger=wandb
    - logger.wandb.project=dem
    - +logger.wandb.entity=hrishitmitra357-national-institute-of-technology-tiruchi
    - +logger.wandb.name=cvsi_base_K500_seed12346
    - logger.wandb.group=rb_vs_base_K500
    - model.num_estimator_mc_samples=500
    - seed=12346
    - ++model.version=1001
  job:
    name: train
    chdir: null
    override_dirname: ++model.version=1001,+logger.wandb.entity=hrishitmitra357-national-institute-of-technology-tiruchi,+logger.wandb.name=cvsi_base_K500_seed12346,experiment=gmm_idem,logger.wandb.group=rb_vs_base_K500,logger.wandb.project=dem,logger=wandb,model.num_estimator_mc_samples=500,model.use_cvsi=true,seed=12346,trainer=gpu
    id: ???
    num: ???
    config_name: train.yaml
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.6
    version_base: '1.3'
    cwd: /storage/ice1/3/3/hmitra7/projects/CVSI
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /storage/ice1/3/3/hmitra7/projects/CVSI/configs
      schema: file
      provider: main
    - path: hydra_plugins.hydra_colorlog.conf
      schema: pkg
      provider: hydra-colorlog
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/hice1/hmitra7/scratch/projects/CVSI/runs/K500/base/seed12346
    choices:
      debug: null
      local: default
      experiment: gmm_idem
      hydra: default
      extras: default
      paths: default
      trainer: gpu
      logger: wandb
      callbacks: default
      model: dem
      model/noise_schedule: geometric
      energy: gmm
      data: dummy
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: colorlog
      hydra/hydra_logging: colorlog
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
